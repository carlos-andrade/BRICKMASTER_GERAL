name: Volatilidade — biblioteca de referência
on:
  push:
    branches: [feature/volatilidade-reference-library, develop]
    paths:
      - "MODULOS/VOLATILIDADE/REFERENCIA/**"
      - ".github/workflows/volatilidade-reference-tests.yml"
  pull_request:
    paths:
      - "MODULOS/VOLATILIDADE/REFERENCIA/**"
      - ".github/workflows/volatilidade-reference-tests.yml"
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar testes unitários
        run: python -m unittest discover -s MODULOS/VOLATILIDADE/REFERENCIA -p "test_*.py" -v
      - name: Gerar comparação sintética
        working-directory: MODULOS/VOLATILIDADE/REFERENCIA
        run: python comparar_estimadores.py
